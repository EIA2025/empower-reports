{% extends 'base.html' %}
{% block title %}Add Vaccination - {{ student.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <h1>Add Vaccination for {{ student.name }}</h1>
    <a href="{{ url_for('health.student_health_profile', student_id=student.id) }}" class="btn btn-secondary mb-3">Back</a>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" class="needs-validation">
                <div class="mb-3">
                    <label class="form-label">Vaccine Name</label>
                    <input type="text" class="form-control" name="vaccine_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Vaccination Date</label>
                    <input type="date" class="form-control" name="vaccination_date" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Batch Number</label>
                    <input type="text" class="form-control" name="batch_number">
                </div>
                <div class="mb-3">
                    <label class="form-label">Administered By</label>
                    <input type="text" class="form-control" name="administered_by">
                </div>
                <div class="mb-3">
                    <label class="form-label">Facility</label>
                    <input type="text" class="form-control" name="facility">
                </div>
                <div class="mb-3">
                    <label class="form-label">Next Dose Date</label>
                    <input type="date" class="form-control" name="next_dose_date">
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" name="certificate_uploaded" id="certificate_uploaded">
                        <label class="form-check-label" for="certificate_uploaded">Certificate Uploaded</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Vaccination</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
