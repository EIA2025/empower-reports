{% extends 'base.html' %}
{% block title %}Record Clinic Visit - {{ student.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <h1>Record Clinic Visit for {{ student.name }}</h1>
    <a href="{{ url_for('health.student_health_profile', student_id=student.id) }}" class="btn btn-secondary mb-3">Back</a>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" class="needs-validation">
                <div class="mb-3">
                    <label class="form-label">Visit Date</label>
                    <input type="date" class="form-control" name="visit_date" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Complaint</label>
                    <textarea class="form-control" name="complaint" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Diagnosis</label>
                    <textarea class="form-control" name="diagnosis" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Treatment Given</label>
                    <textarea class="form-control" name="treatment_given" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" name="referred" id="referred">
                        <label class="form-check-label" for="referred">Referred to External Facility</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Referred To</label>
                    <input type="text" class="form-control" name="referred_to">
                </div>
                <div class="mb-3">
                    <label class="form-label">Follow-up Date</label>
                    <input type="date" class="form-control" name="follow_up_date">
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Clinic Visit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
