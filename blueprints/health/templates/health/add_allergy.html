{% extends 'base.html' %}
{% block title %}Add Allergy - {{ student.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <h1>Add Allergy for {{ student.name }}</h1>
    <a href="{{ url_for('health.student_health_profile', student_id=student.id) }}" class="btn btn-secondary mb-3">Back</a>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" class="needs-validation">
                <div class="mb-3">
                    <label class="form-label">Allergen</label>
                    <input type="text" class="form-control" name="allergen" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Severity</label>
                    <select class="form-control" name="severity">
                        <option value="mild">Mild</option>
                        <option value="moderate">Moderate</option>
                        <option value="severe">Severe</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Symptoms</label>
                    <textarea class="form-control" name="symptoms" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Treatment</label>
                    <textarea class="form-control" name="treatment" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Allergy</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
