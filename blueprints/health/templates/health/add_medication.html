{% extends 'base.html' %}
{% block title %}Add Medication - {{ student.name }}{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <h1>Add Medication for {{ student.name }}</h1>
    <a href="{{ url_for('health.student_health_profile', student_id=student.id) }}" class="btn btn-secondary mb-3">Back</a>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" class="needs-validation">
                <div class="mb-3">
                    <label class="form-label">Medication Name</label>
                    <input type="text" class="form-control" name="medication_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Dosage</label>
                    <input type="text" class="form-control" name="dosage">
                </div>
                <div class="mb-3">
                    <label class="form-label">Frequency</label>
                    <input type="text" class="form-control" name="frequency" placeholder="e.g., Twice daily">
                </div>
                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" class="form-control" name="start_date">
                </div>
                <div class="mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" class="form-control" name="end_date">
                </div>
                <div class="mb-3">
                    <label class="form-label">Prescribed By</label>
                    <input type="text" class="form-control" name="prescribed_by">
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Medication</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
