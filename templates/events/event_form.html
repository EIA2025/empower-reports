{% extends 'base.html' %}
{% block title %}{{ 'Edit' if event else 'Add' }} Event{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-calendar-plus me-2"></i>{{ 'Edit' if event else 'Create' }} Event</h5>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Event Title *</label>
            <input type="text" name="title" class="form-control" required value="{{ event.title if event else '' }}">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                {% for cat in ['general','academic','sports','cultural','religious','holiday','meeting'] %}
                <option value="{{ cat }}" {% if event and event.category==cat %}selected{% endif %}>{{ cat|title }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Location</label>
              <input type="text" name="location" class="form-control" value="{{ event.location if event else '' }}" placeholder="e.g. Main Hall">
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Start Date *</label>
              <input type="date" name="start_date" class="form-control" required
                value="{{ event.start_date.strftime('%Y-%m-%d') if event and event.start_date else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">End Date</label>
              <input type="date" name="end_date" class="form-control"
                value="{{ event.end_date.strftime('%Y-%m-%d') if event and event.end_date else '' }}">
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Start Time</label>
              <input type="time" name="start_time" class="form-control"
                value="{{ event.start_time.strftime('%H:%M') if event and event.start_time else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">End Time</label>
              <input type="time" name="end_time" class="form-control"
                value="{{ event.end_time.strftime('%H:%M') if event and event.end_time else '' }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Target Audience</label>
            <select name="target_role" class="form-select">
              {% for r in [('all','Everyone'),('student','Students'),('parent','Parents'),('teacher','Teachers'),('staff','Staff')] %}
              <option value="{{ r[0] }}" {% if event and event.target_role==r[0] %}selected{% endif %}>{{ r[1] }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ event.description if event else '' }}</textarea>
          </div>
          <div class="mb-4 form-check">
            <input type="checkbox" name="is_public" class="form-check-input" id="isPublic"
              {% if not event or event.is_public %}checked{% endif %}>
            <label class="form-check-label" for="isPublic">Visible to all users (including parents & students)</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ 'Update Event' if event else 'Create Event' }}</button>
            <a href="{{ url_for('events.calendar') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
