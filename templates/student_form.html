{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'Add' }} Student{% endblock %}
{% block content %}
<div class="mb-3"><a href="{{ url_for('students') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
<div class="card" style="max-width:640px">
  <div class="card-header">{{ 'Edit' if student else 'Add New' }} Student</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-8"><label class="form-label">Full Name *</label><input type="text" name="name" class="form-control" value="{{ student.name if student else '' }}" required></div>
        <div class="col-md-4"><label class="form-label">Year</label><input type="number" name="year" class="form-control" value="{{ student.year if student else '' }}"></div>
        <div class="col-md-6"><label class="form-label">Class *</label><input type="text" name="class_name" class="form-control" value="{{ student.class_name if student else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Registration No *</label><input type="text" name="registration_number" class="form-control" value="{{ student.registration_number if student else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Gender</label>
          <select name="gender" class="form-select">
            <option value="">-- Select --</option>
            <option value="Male" {{ 'selected' if student and student.gender=='Male' else '' }}>Male</option>
            <option value="Female" {{ 'selected' if student and student.gender=='Female' else '' }}>Female</option>
          </select>
        </div>
        <div class="col-md-6"><label class="form-label">Enrollment Date</label><input type="date" name="enrollment_date" class="form-control" value="{{ student.enrollment_date if student else '' }}"></div>
        <div class="col-12">
          <label class="form-label">Subjects (comma-separated)</label>
          <input type="text" id="subjects_input" class="form-control" placeholder="Mathematics, English, Science ...">
          <div id="subjects_tags" class="mt-2 d-flex flex-wrap gap-1"></div>
          <div id="subjects_hidden"></div>
        </div>
      </div>
      <hr>
      <button type="submit" class="btn btn-brand w-100">{{ 'Update' if student else 'Add' }} Student</button>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const existingSubjects = {{ subjects | tojson if subjects is defined else '[]' }};
let subs = [...existingSubjects];
function renderTags(){
  const tc = document.getElementById('subjects_tags');
  const hc = document.getElementById('subjects_hidden');
  tc.innerHTML = '';
  hc.innerHTML = '';
  subs.forEach((s,i) => {
    tc.innerHTML += `<span class="badge bg-primary">${s} <span style="cursor:pointer" onclick="removeSub(${i})">×</span></span>`;
    hc.innerHTML += `<input type="hidden" name="subjects" value="${s}">`;
  });
}
function removeSub(i){ subs.splice(i,1); renderTags(); }
document.getElementById('subjects_input').addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.key === ','){
    e.preventDefault();
    const v = this.value.trim().replace(/,$/,'');
    if(v && !subs.includes(v)){ subs.push(v); renderTags(); }
    this.value = '';
  }
});
renderTags();
</script>
{% endblock %}
