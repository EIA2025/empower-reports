{% extends 'base.html' %}
{% block title %}{{ 'Edit' if book else 'Add' }} Book{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-book-half me-2"></i>{{ 'Edit' if book else 'Add' }} Book</h5>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Title *</label>
              <input type="text" name="title" class="form-control" required value="{{ book.title if book else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Author</label>
              <input type="text" name="author" class="form-control" value="{{ book.author if book else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">ISBN</label>
              <input type="text" name="isbn" class="form-control" value="{{ book.isbn if book else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Category</label>
              <input type="text" name="category" class="form-control" list="catOptions"
                value="{{ book.category if book else '' }}" placeholder="e.g. Mathematics, Fiction…">
              <datalist id="catOptions">
                <option value="Textbook"><option value="Reference"><option value="Fiction">
                <option value="Science"><option value="Mathematics"><option value="History">
                <option value="Religion"><option value="Literature">
              </datalist>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Publisher</label>
              <input type="text" name="publisher" class="form-control" value="{{ book.publisher if book else '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Year Published</label>
              <input type="number" name="year_published" class="form-control" min="1800" max="2030"
                value="{{ book.year_published if book else '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Total Copies</label>
              <input type="number" name="total_copies" class="form-control" min="1"
                value="{{ book.total_copies if book else 1 }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Location / Shelf</label>
              <input type="text" name="location" class="form-control" value="{{ book.location if book else '' }}"
                placeholder="e.g. Shelf A3">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Description</label>
              <textarea name="description" class="form-control" rows="3">{{ book.description if book else '' }}</textarea>
            </div>
          </div>
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ 'Update Book' if book else 'Add Book' }}</button>
            <a href="{{ url_for('library.books') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
