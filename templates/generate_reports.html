{% extends "base.html" %}{% block title %}Generate Reports{% endblock %}
{% block content %}
<h2 class="fw-bold mb-3"><i class="bi bi-file-pdf me-2"></i>Generate Reports</h2>
<div class="card"><div class="card-header">Report Generator</div>
<div class="card-body">
<form method="POST">
<div class="row g-3">
<div class="col-md-4">
<label class="form-label fw-semibold">Report Type</label>
<select name="report_type" class="form-select" id="reportType">
<option value="end_term">End of Term Report</option>
<option value="visitation_day">Visitation Day (Mid-Term) Report</option>
</select>
</div>
<div class="col-md-4">
<label class="form-label fw-semibold">Term *</label>
<select name="term_id" class="form-select" required>
{% for t in terms %}<option value="{{ t.id }}" {{ 'selected' if active_term and t.id==active_term.id }}>{{ t.term_name }}</option>{% endfor %}
</select>
</div>
<div class="col-md-4">
<label class="form-label fw-semibold">Scope</label>
<select name="scope" class="form-select" id="scopeSelect" onchange="toggleScope()">
<option value="class">Whole Class (ZIP)</option>
<option value="individual">Individual Student (PDF)</option>
</select>
</div>
<div class="col-md-6" id="classField">
<label class="form-label fw-semibold">Class</label>
<select name="class_name" class="form-select">
{% for c in classes %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
</select>
</div>
<div class="col-md-6" id="studentField" style="display:none">
<label class="form-label fw-semibold">Student</label>
<select name="student_id" class="form-select">
{% for s in students %}<option value="{{ s.id }}">{{ s.name }} ({{ s.class_name }})</option>{% endfor %}
</select>
</div>
</div>
<hr>
<button type="submit" class="btn btn-brand btn-lg w-100"><i class="bi bi-download me-2"></i>Generate & Download</button>
</form>
</div></div>

<div class="card mt-4"><div class="card-header"><i class="bi bi-download me-2"></i>Quick Data Exports (CSV)</div>
<div class="card-body d-flex gap-2 flex-wrap">
<a href="{{ url_for('data_export', type='students') }}" class="btn btn-outline-primary"><i class="bi bi-people me-1"></i>Students CSV</a>
<a href="{{ url_for('data_export', type='marks') }}" class="btn btn-outline-success"><i class="bi bi-pencil-square me-1"></i>Marks CSV</a>
<a href="{{ url_for('data_export', type='discipline') }}" class="btn btn-outline-danger"><i class="bi bi-exclamation-triangle me-1"></i>Discipline CSV</a>
</div></div>
{% endblock %}
{% block extra_js %}
<script>
function toggleScope(){
  const v=document.getElementById('scopeSelect').value;
  document.getElementById('classField').style.display=v==='class'?'block':'none';
  document.getElementById('studentField').style.display=v==='individual'?'block':'none';
  document.querySelector('[name=class_name]').required=v==='class';
}
</script>
{% endblock %}
