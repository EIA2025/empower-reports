{% extends "base.html" %}{% block title %}Change Login Details{% endblock %}
{% block content %}
<h2 class="fw-bold mb-3"><i class="bi bi-key me-2"></i>Change Login Details</h2>
<div class="card" style="max-width:580px">
<div class="card-body">
<form method="POST">
<h5 class="fw-semibold mb-3">Update Credentials</h5>
<div class="mb-3"><label class="form-label">New Username/Email *</label><input type="text" name="new_email" class="form-control" value="{{ user.email }}" required></div>
<div class="mb-3"><label class="form-label">Current Password *</label><input type="password" name="current_password" class="form-control" required></div>
<div class="mb-3"><label class="form-label">New Password <small class="text-muted">(leave blank to keep)</small></label><input type="password" name="new_password" class="form-control"></div>
<div class="mb-3"><label class="form-label">Confirm New Password</label><input type="password" name="confirm_password" class="form-control"></div>
<hr>
<h5 class="fw-semibold mb-2">Recovery Details</h5>
<p class="text-muted small">Provide at least one recovery detail. These are used to reset your password if you forget it.</p>
<div class="mb-3"><label class="form-label">Phone Number</label><input type="text" name="recovery_phone" class="form-control" value="{{ user.recovery_phone or '' }}" placeholder="+256XXXXXXXXX"></div>
<div class="mb-3"><label class="form-label">City of Birth</label><input type="text" name="recovery_city" class="form-control" value="{{ user.recovery_city or '' }}"></div>
<div class="mb-3"><label class="form-label">Nickname / Pet / Spouse Name</label><input type="text" name="recovery_nickname" class="form-control" value="{{ user.recovery_nickname or '' }}"></div>
<button type="submit" class="btn btn-brand w-100">Update Login Details</button>
</form></div></div>
{% endblock %}
