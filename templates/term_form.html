{% extends "base.html" %}{% block title %}{{ 'Edit' if term else 'Add' }} Term{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="{{ url_for('academics.terms') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back to Calendar
  </a>
</div>
<div class="card" style="max-width:580px">
  <div class="card-header">{{ 'Edit' if term else 'Add' }} Academic Term</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Year *</label>
          <input type="number" name="year" class="form-control" required
                 value="{{ term.year if term else current_year }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Term Number *</label>
          <select name="term_number" class="form-select">
            {% for n in [1,2,3] %}
            <option value="{{ n }}" {{ 'selected' if term and term.term_number==n }}>Term {{ n }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Term Name *</label>
          <input type="text" name="term_name" class="form-control" required
                 placeholder="e.g. Term 1 2025"
                 value="{{ term.term_name if term else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Start Date *</label>
          <input type="date" name="start_date" class="form-control" required
                 value="{{ term.start_date if term else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">End Date *</label>
          <input type="date" name="end_date" class="form-control" required
                 value="{{ term.end_date if term else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Next Term Begins</label>
          <input type="date" name="next_term_begins" class="form-control"
                 value="{{ term.next_term_begins if term else '' }}">
        </div>
        <div class="col-12">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" name="is_active" id="is_active"
                   {{ 'checked' if term and term.is_active }}>
            <label class="form-check-label" for="is_active">Set as Active Term</label>
          </div>
        </div>
      </div>
      <hr>
      <button type="submit" class="btn btn-brand w-100">
        <i class="bi bi-{{ 'pencil' if term else 'plus-lg' }} me-2"></i>
        {{ 'Update Term' if term else 'Add Term' }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
