services:
  - type: web
    name: empower-reports
    env: python
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: empower-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: empower-db
    databaseName: empower
    user: empower_user
    plan: free
